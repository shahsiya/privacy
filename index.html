<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Политика конфиденциальности — Universal Profit Calculator</title>
	<style>
		:root {
			--bg: #0b0f14;
			--card: #121821;
			--text: #e7eef7;
			--muted: #9bb0c7;
			--accent: #16a085;
			--border: #223042;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
				"Apple Color Emoji", "Segoe UI Emoji";
			background: var(--bg);
			color: var(--text);
		}

		.container {
			max-width: 920px;
			margin: 0 auto;
			padding: 32px 16px 20px;
			flex: 1;
		}

		header {
			display: flex;
			gap: 16px;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 24px;
		}

		.title {
			font-size: clamp(22px, 3vw, 32px);
			font-weight: 800;
			letter-spacing: 0.2px;
		}

		.subtitle {
			color: var(--muted);
			margin-top: 6px;
			font-size: 14px;
		}

		.card {
			background: linear-gradient(180deg,
					rgba(255, 255, 255, 0.02),
					rgba(255, 255, 255, 0) 60%),
				var(--card);
			border: 1px solid var(--border);
			border-radius: 16px;
			padding: 22px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
		}

		.grid {
			display: grid;
			gap: 16px;
		}

		h2 {
			margin: 18px 0 8px;
			font-size: 20px;
		}

		p {
			margin: 8px 0;
			line-height: 1.6;
			color: var(--text);
		}

		ul {
			margin: 8px 0 8px 18px;
			line-height: 1.6;
			color: var(--text);
			background-color: rgba(255, 255, 255, 0.03);
			padding: 8px 12px;
			border-radius: 8px;
		}

		li {
			color: var(--text);
		}

		footer {
			color: var(--muted);
			font-size: 13px;
			text-align: center;
			margin-top: 20px;
		}

		.lang {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: var(--card);
			border: 1px solid var(--border);
			padding: 8px 12px;
			border-radius: 999px;
		}

		.lang select {
			background: #2c3443;
			color: #ffffff;
			border: none;
			outline: none;
			font-weight: 600;
			padding: 2px 6px;
			border-radius: 4px;
			cursor: pointer;
		}

		.lang span {
			color: var(--text);
			font-weight: 500;
		}

		a {
			color: var(--text);
			text-decoration: underline dotted;
		}

		.appname {
			font-weight: 700;
		}
	</style>
</head>

<body>
	<div class="container">
		<header>
			<div>
				<div class="title" data-i18n="title"></div>
				<div class="subtitle" data-i18n="subtitle"></div>
			</div>
			<label class="lang" aria-label="Language selector">
				<span data-i18n="language"></span>
				<select id="lang">
					<option value="ru">Русский</option>
					<option value="en">English</option>
					<option value="tr">Türkçe</option>
				</select>
			</label>
		</header>

		<main class="card">
			<div class="grid">
				<p data-i18n="intro"></p>

				<h2 data-i18n="section_collect"></h2>
				<p data-i18n="collect_p1"></p>

				<h2 data-i18n="section_access"></h2>
				<p data-i18n="access_p1"></p>

				<h2 data-i18n="section_export"></h2>
				<p data-i18n="export_p1"></p>

				<h2 data-i18n="section_security"></h2>
				<p data-i18n="security_p1"></p>

				<h2 data-i18n="section_changes"></h2>
				<p data-i18n="changes_p1"></p>

				<h2 data-i18n="section_contact"></h2>
				<p data-i18n="contact_p1"></p>
			</div>

			<footer>
				<div data-i18n="last_updated"></div>
			</footer>
		</main>
	</div>

	<footer>
		© 2025 Profit Calculator
	</footer>

	<script>
		const APP_NAME = 'Universal Profit Calculator';
		const CONTACT = 'master_work@outlook.com';

		const translations = {
			ru: {
				title: `Политика конфиденциальности — <span class="appname">${APP_NAME}</span>`,
				subtitle: 'Мы уважаем вашу конфиденциальность и не собираем персональные данные.',
				language: 'Язык',
				intro: `${APP_NAME} уважает конфиденциальность пользователей и гарантирует защиту их данных.`,
				section_collect: 'Сбор и использование информации',
				collect_p1: 'Приложение не собирает и не хранит персональные данные. Все введённые значения используются только локально на вашем устройстве и не передаются третьим лицам.',
				section_access: 'Доступ к данным и разрешения',
				access_p1: 'Приложение не запрашивает доступ к контактам, геолокации, камере, микрофону или другим личным данным.',
				section_export: 'Экспорт и печать',
				export_p1: 'Вы можете экспортировать результаты в PDF-файл для личного использования. Приложение не имеет доступа к содержимому PDF и не отправляет их на сторонние сервера.',
				section_security: 'Безопасность',
				security_p1: 'Приложение работает локально и не использует облачное хранилище, минимизируя риск утечки данных.',
				section_changes: 'Изменения настоящей Политики',
				changes_p1: 'Мы можем периодически обновлять эту Политику. Рекомендуем просматривать её время от времени.',
				section_contact: 'Контакты',
				contact_p1: `Если есть вопросы, свяжитесь: <a href="mailto:${CONTACT}">${CONTACT}</a>.`,
				last_updated: 'Последнее обновление: 15 августа 2025 г.'
			},
			en: {
				title: `Privacy Policy — <span class="appname">${APP_NAME}</span>`,
				subtitle: 'We respect your privacy and do not collect personal data.',
				language: 'Language',
				intro: `${APP_NAME} respects users’ privacy and is committed to protecting their data.`,
				section_collect: 'Information Collection and Use',
				collect_p1: 'The app does not collect or store personal data. All values you enter are used only locally on your device and are not shared with third parties.',
				section_access: 'Data Access & Permissions',
				access_p1: 'The app does not request access to contacts, location, camera, microphone, or other personal data.',
				section_export: 'Export & Printing',
				export_p1: 'You can export results to a PDF file for personal use. The app cannot access PDF content or upload it to external servers.',
				section_security: 'Security',
				security_p1: 'The app works locally and does not use cloud storage, minimizing the risk of data leaks.',
				section_changes: 'Changes to This Policy',
				changes_p1: 'We may update this Privacy Policy from time to time. Review it periodically to stay informed.',
				section_contact: 'Contact',
				contact_p1: `If you have questions, contact us at: <a href="mailto:${CONTACT}">${CONTACT}</a>.`,
				last_updated: 'Last updated: August 15, 2025'
			},
			tr: {
				title: `Gizlilik Politikası — <span class="appname">${APP_NAME}</span>`,
				subtitle: 'Gizliliğinize saygı duyuyoruz ve kişisel veri toplamıyoruz.',
				language: 'Dil',
				intro: `${APP_NAME}, kullanıcıların gizliliğine saygı duyar ve verilerini korumayı taahhüt eder.`,
				section_collect: 'Bilgi Toplama ve Kullanım',
				collect_p1: 'Uygulama kişisel verileri toplamaz veya saklamaz. Girilen tüm değerler sadece cihazınızda yerel olarak kullanılır ve üçüncü taraflarla paylaşılmaz.',
				section_access: 'Veri Erişimi ve İzinler',
				access_p1: 'Uygulama kişisel verilere, konum, kamera, mikrofon veya diğer verilere erişmez.',
				section_export: 'Dışa Aktarma ve Yazdırma',
				export_p1: 'Hesaplama sonuçlarını PDF olarak dışa aktarabilirsiniz. Uygulama PDF içeriğine erişmez ve harici sunuculara yüklemez.',
				section_security: 'Güvenlik',
				security_p1: 'Uygulama yerel çalışır ve bulut depolama kullanmaz, veri sızıntısı riskini en aza indirir.',
				section_changes: 'Bu Politikadaki Değişiklikler',
				changes_p1: 'Bu Gizlilik Politikasını zaman zaman güncelleyebiliriz. Periyodik olarak kontrol etmenizi öneririz.',
				section_contact: 'İletişim',
				contact_p1: `Sorular için: <a href="mailto:${CONTACT}">${CONTACT}</a>.`,
				last_updated: 'Son güncelleme: 15 Ağustos 2025'
			}
		};

		function applyLang(lang) {
			const dict = translations[lang] || translations.ru;
			document.documentElement.lang = lang;
			document.querySelectorAll('[data-i18n]').forEach(el => {
				const key = el.getAttribute('data-i18n');
				if (dict[key] !== undefined) {
					if (/(<[^>]+>)/.test(dict[key])) {
						el.innerHTML = dict[key];
					} else {
						el.textContent = dict[key];
					}
				}
			});
			const tmp = document.createElement('div');
			tmp.innerHTML = dict.title;
			document.title = tmp.textContent || 'Privacy Policy';
			localStorage.setItem('pp_lang', lang);
		}

		const select = document.getElementById('lang');
		const saved = localStorage.getItem('pp_lang') || (navigator.language || 'ru').slice(0, 2);
		const start = ['ru', 'en', 'tr'].includes(saved) ? saved : 'ru';
		select.value = start;
		applyLang(start);
		select.addEventListener('change', () => applyLang(select.value));
	</script>
</body>

</html>
